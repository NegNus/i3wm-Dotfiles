[global]
    frame_color = "#3C3836"
    font = JetBrainsMono Nerd Font 10 

[urgency_low]
    background = "#282828"
    foreground = "#EBDBB2"
    timeout = 10
    default_icon = dialog-information

[urgency_normal]
    background = "#282828"
    foreground = "#EBDBB2"    # Gruvbox “bright green” accent
    timeout = 10
    override_pause_level = 30
    default_icon = dialog-information

[urgency_critical]
    background = "#3C3836"
    foreground = "#FB4934"    # Gruvbox “bright red” warning color
    frame_color = "#CC241D"   # Gruvbox “neutral red”
    timeout = 0
    override_pause_level = 60
    default_icon = dialog-warning
